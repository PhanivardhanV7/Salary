<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Salary Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4ff, #faf5ff, #f0fdf4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, #a78bfa, #6c63ff);
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      top: -150px; left: -150px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, #f472b6, #ec4899);
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
      bottom: -100px; right: -100px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(108,99,255,0.1);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
    .logo h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 4px;
      color: #111;
    }
    .logo p { font-size: 0.82rem; color: #666; letter-spacing: 1.5px; margin-top: 4px; }

    .tabs {
      display: flex;
      background: rgba(167,139,250,0.08);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 9px;
      cursor: pointer;
      color: #888;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active {
      background: #fff;
      color: #111;
      box-shadow: 0 2px 8px rgba(108,99,255,0.12);
    }

    .form { display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #444;
    }
    .form-group input {
      background: rgba(167,139,250,0.06);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 12px;
      color: #111;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .form-group input::placeholder { color: #aaa; }
    .form-group input:focus {
      border-color: #a78bfa;
      background: rgba(167,139,250,0.1);
    }

    .btn-submit {
      background: linear-gradient(135deg, #a78bfa, #6c63ff);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 3px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.35);
      margin-top: 4px;
      position: relative;
    }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      font-size: 0.8rem;
      border-radius: 8px;
      padding: 10px 14px;
      display: none;
      text-align: center;
    }
    .msg.error  { color: #dc2626; background: rgba(220,38,38,0.08);  border: 1px solid rgba(220,38,38,0.2);  }
    .msg.success{ color: #059669; background: rgba(5,150,105,0.08);  border: 1px solid rgba(5,150,105,0.2);  }
    .msg.show   { display: block; }

    .forgot {
      text-align: right;
      font-size: 0.75rem;
      color: #a78bfa;
      cursor: pointer;
      font-weight: 600;
    }
    .forgot:hover { text-decoration: underline; }

    .footer-note {
      text-align: center;
      font-size: 0.72rem;
      color: #aaa;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      top: 20px; right: 20px;
      transform: translateY(-20px);
      background: rgba(167,139,250,0.95);
      color: #fff;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* firebase not configured banner */
    .config-banner {
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(251,191,36,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.78rem;
      color: #92400e;
      margin-bottom: 16px;
      display: none;
    }
    .config-banner.show { display: block; }

    @media (max-width: 768px) {
      .card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span class="logo-icon">💸</span>
      <h1>SALARY TRACKER</h1>
      <p>Track · Categorise · Stay in Budget</p>
    </div>

    <div class="config-banner" id="configBanner" style="display:none;">
      ⚠️ Firebase not configured yet. Open <strong>login.html</strong> and paste your project credentials.
    </div>

    <div class="tabs">
      <div class="tab active" id="tabLogin"    onclick="switchTab('login')">Login</div>
      <div class="tab"        id="tabRegister" onclick="switchTab('register')">Register</div>
    </div>

    <div class="msg error"   id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <!-- LOGIN -->
    <div id="loginForm" class="form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Your password" autocomplete="current-password" />
      </div>
      <span class="forgot" onclick="doForgot()">Forgot password?</span>
      <button class="btn-submit" id="btnLogin" onclick="doLogin()">LOGIN</button>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="form" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Min 6 characters" autocomplete="new-password" />
      </div>
      <button class="btn-submit" id="btnRegister" onclick="doRegister()">CREATE ACCOUNT</button>
    </div>

    <div class="footer-note">Powered by Firebase — data syncs across all devices</div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword,
             createUserWithEmailAndPassword,
             updateProfile, sendPasswordResetEmail,
             onAuthStateChanged }                     from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc,
             getDoc, collection, getDocs }            from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ── CONFIG — paste your values here ──
    const firebaseConfig = {
      apiKey:            "AIzaSyCOVA9SqYlP4y5_Wkt2Awlf5ZHPLwd5H38",
      authDomain:        "salary-expenses-21650.firebaseapp.com",
      projectId:         "salary-expenses-21650",
      storageBucket:     "salary-expenses-21650.firebasestorage.app",
      messagingSenderId: "996346514995",
      appId:             "1:996346514995:web:830be1d7a44730823ddd46",
      measurementId:     "G-EWEVYRCHFY"
    };

    // Show banner if not configured
    if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
      document.getElementById('configBanner').style.display = 'block';
    }

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // Generate unique 6-digit ID not already taken
    async function generateUserId() {
      let id, exists = true;
      while (exists) {
        id = String(Math.floor(100000 + Math.random() * 900000));
        const snap = await getDoc(doc(db, 'userIds', id));
        exists = snap.exists();
      }
      return id;
    }

    // Redirect if already logged in (but not if we just logged out)
    let justLoggedIn = false;
    const justLoggedOut = sessionStorage.getItem('st_logged_out') === '1';
    if (justLoggedOut) sessionStorage.removeItem('st_logged_out');

    onAuthStateChanged(auth, user => {
      if (user && !justLoggedIn && !justLoggedOut) {
        sessionStorage.setItem('st_user', JSON.stringify({
          uid:   user.uid,
          name:  user.displayName || user.email.split('@')[0],
          email: user.email
        }));
        window.location.href = 'index.html';
      }
    });

    // ── LOGIN ──
    window.doLogin = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      if (!email || !pass) { showError('Please fill in all fields'); return; }

      setLoading('btnLogin', true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);

        // Extract name and userId — try Firestore first, fallback to displayName
        let name   = cred.user.displayName || email.split('@')[0];
        let userId = '——';

        // Check if displayName has embedded userId (format: "Name||123456")
        if (cred.user.displayName && cred.user.displayName.includes('||')) {
          const parts = cred.user.displayName.split('||');
          name   = parts[0];
          userId = parts[1];
        }

        // Try to get from Firestore (more reliable)
        try {
          const profileSnap = await getDoc(doc(db, 'users', cred.user.uid));
          if (profileSnap.exists()) {
            const profile = profileSnap.data();
            name   = profile.name   || name;
            userId = profile.userId || userId;
          }
        } catch (firestoreErr) {
          console.warn('Firestore read failed, using fallback:', firestoreErr);
        }

        justLoggedIn = true;
        sessionStorage.setItem('st_user', JSON.stringify({
          uid: cred.user.uid, name, email: cred.user.email, userId
        }));
        showToast(`Welcome back, ${name}!`);
        setTimeout(() => window.location.href = 'index.html', 600);
      } catch (e) {
        showError(friendlyError(e.code));
      } finally {
        setLoading('btnLogin', false);
      }
    };

    // ── REGISTER ──
    window.doRegister = async function() {
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPass').value;
      if (!name || !email || !pass) { showError('Please fill in all fields'); return; }
      if (pass.length < 6) { showError('Password must be at least 6 characters'); return; }

      setLoading('btnRegister', true);
      try {
        // 1. Create auth account
        const cred = await createUserWithEmailAndPassword(auth, email, pass);

        // 2. Generate unique 6-digit user ID
        let userId = null;
        try {
          userId = await generateUserId();
          // Save user profile in Firestore
          await setDoc(doc(db, 'users', cred.user.uid), {
            name, email, userId, createdAt: new Date().toISOString()
          });
          // Reserve the 6-digit ID
          await setDoc(doc(db, 'userIds', userId), { uid: cred.user.uid });
        } catch (firestoreErr) {
          console.error('Firestore error:', firestoreErr);
          // Fallback: generate a local ID if Firestore fails
          userId = String(Math.floor(100000 + Math.random() * 900000));
        }

        // 3. Update display name with userId embedded
        await updateProfile(cred.user, { displayName: `${name}||${userId}` });

        justLoggedIn = true;
        sessionStorage.setItem('st_user', JSON.stringify({
          uid: cred.user.uid, name, email, userId
        }));
        showSuccess(`✓ Account created! Your User ID: ${userId}`);
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (e) {
        showError(friendlyError(e.code));
      } finally {
        setLoading('btnRegister', false);
      }
    };

    // ── FORGOT PASSWORD ──
    window.doForgot = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) { showError('Enter your email first'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showSuccess('Password reset email sent! Check your inbox.');
      } catch (e) {
        showError(friendlyError(e.code));
      }
    };

    function friendlyError(code) {
      const map = {
        'auth/user-not-found':       'No account found with this email',
        'auth/wrong-password':       'Incorrect password',
        'auth/email-already-in-use': 'Email already registered',
        'auth/invalid-email':        'Invalid email address',
        'auth/weak-password':        'Password is too weak',
        'auth/too-many-requests':    'Too many attempts. Try again later',
        'auth/network-request-failed': 'Network error. Check your connection',
        'auth/invalid-credential':   'Invalid email or password',
      };
      return map[code] || 'Something went wrong. Try again.';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span> Please wait...'
        : (btnId === 'btnLogin' ? 'LOGIN' : 'CREATE ACCOUNT');
    }
  </script>

  <script>
    function switchTab(tab) {
      document.getElementById('loginForm').style.display    = tab === 'login'    ? 'flex' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
      document.getElementById('tabLogin').classList.toggle('active',    tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showError(msg) {
      document.getElementById('errorMsg').textContent = '⚠️ ' + msg;
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showSuccess(msg) {
      document.getElementById('successMsg').textContent = '✓ ' + msg;
      document.getElementById('successMsg').classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const isLogin = document.getElementById('loginForm').style.display !== 'none';
      if (isLogin) window.doLogin(); else window.doRegister();
    });
  </script>

</body>
</html>
